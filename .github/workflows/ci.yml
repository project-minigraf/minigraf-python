name: Python CI

on:
  push:
    branches: [main, v3]
  pull_request:
    branches: [main, v3]
  workflow_call:
    inputs:
      ref:
        description: 'Git ref to test (release.yml passes the pinned release tag)'
        required: false
        type: string
        default: ''
      version:
        description: 'Version stamped into the wheels, PEP 440 (release.yml passes the release version)'
        required: false
        type: string
        default: '0.0.0.dev0'

jobs:
  test:
    name: Python tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-14, windows-latest]

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install maturin
        run: pip install "maturin>=1.5"

      - name: Create virtualenv
        run: python -m venv .venv

      - name: Build and test
        run: |
          source .venv/bin/activate 2>/dev/null || source .venv/Scripts/activate
          pip install pytest
          bash build.sh test
        shell: bash

  # Builds the wheels as the release publishes them.
  package:
    name: Package
    uses: ./.github/workflows/package.yml
    with:
      ref: ${{ inputs.ref }}
      version: ${{ inputs.version || '0.0.0.dev0' }}

  # Installs the built wheel into a new virtual environment, without PyPI, and
  # runs the README quick start and the consumer contract.
  consumer:
    name: Consumer test (${{ matrix.os }})
    needs: package
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-14, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-wheel-*
          path: dist
          merge-multiple: true
      - name: Run consumer test
        shell: bash
        run: bash consumer-test/run.sh local dist ${{ inputs.version || '0.0.0.dev0' }}

  readme-sync:
    name: README quick start matches the consumer test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - run: python3 -I consumer-test/readme_sync.py README.md consumer-test/quickstart.py
